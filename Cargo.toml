[workspace]
resolver = "2"

[package]
name = "calcit_paint"
version = "0.0.10"
authors = ["jiyinyiyong <jiyinyiyong@gmail.com>"]
edition = "2021"
description = "Native Skia canvas bindings for the Calcit language"
license = "MIT"
repository = "https://github.com/calcit-lang/calcit-paint"
exclude = ["resources", "!SourceCodePro-Medium.ttf"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
calcit_native_ffi = "0.1.2"
cirru_edn = "0.8.0"
lazy_static = "1.5.0"
env_logger = "0.11.11"
euclid = "0.22.14"
winit = "0.30.13"
skia-safe = { version = "0.97.2", features = ["gl"] }
glutin = "0.32.3"
glutin-winit = "0.5.0"
raw-window-handle = "0.6.2"
gl-rs = { package = "gl", version = "0.14.0" }

[lib]
name = "calcit_paint"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]


# [profile.release]
# debug = true

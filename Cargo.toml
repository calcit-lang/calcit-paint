[workspace]
resolver = "2"

[package]
name = "calcit_paint"
version = "0.0.9"
authors = ["jiyinyiyong <jiyinyiyong@gmail.com>"]
edition = "2021"
description = "Native Skia canvas bindings for the Calcit language"
license = "MIT"
repository = "https://github.com/calcit-lang/calcit-paint"
exclude = ["resources", "!SourceCodePro-Medium.ttf"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
calcit_native_ffi = "0.1.1"
cirru_edn = "0.8.0"
lazy_static = "1.4.0"
env_logger = "0.9"
euclid = "0.22.7"
log = "0.4.17"
winit = "0.26.0"
libloading = "0.7.3"
skia-safe = { version = "0.70.0", features = ["gl"] }
glutin = "0.28.0"
gl-rs = { package = "gl", version = "0.14.0" }

[lib]
name = "calcit_paint"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]


# [profile.release]
# debug = true

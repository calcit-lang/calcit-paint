name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: calcit-lang/setup-calcit@v1.3.0
        with:
          version: 0.13.58
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends xvfb xauth libgl1-mesa-dev libgl1-mesa-dri libfontconfig1-dev libfreetype6-dev libxkbcommon-x11-0
      - run: calcit ./calcit.cirru --check-only
      - name: Enforce reviewed Calcit type-quality baseline
        run: calcit analyze quality --baseline config/calcit-quality.json
      - name: Reject dynamic method dispatch
        run: calcit analyze dynamic-methods --max 0 --summary-only
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: ./build.sh
      - name: Audit C-safe exports
        run: |
          symbols=$(nm -D --defined-only dylibs/libcalcit_paint.so | awk '{print $3}')
          for symbol in calcit_ffi_buffer_version calcit_ffi_async_version calcit_ffi_buffer_free push_drawing_data_calcit_ffi_v1 measure_text_calcit_ffi_v1 measure_paragraph_calcit_ffi_v1 render_to_png_calcit_ffi_v1 request_focus_calcit_ffi_v1 clear_focus_calcit_ffi_v1 focused_calcit_ffi_v1 launch_canvas_calcit_ffi_blocking_v1; do
            echo "$symbols" | grep -Fx "$symbol"
          done
          for legacy in launch_canvas push_drawing_data abi_version; do
            if echo "$symbols" | grep -Fx "$legacy"; then
              echo "legacy Rust ABI export remains: $legacy" >&2
              exit 1
            fi
          done
      - name: Run offscreen PNG smoke
        run: |
          calcit ./calcit.cirru eval '&call-dylib-edn |./dylibs/libcalcit_paint.so |render_to_png $ {} (:path |offscreen-ci.png) (:width 12) (:height 8) (:scene ({} (:type :rectangle) (:position ([] 2 2)) (:width 6) (:height 4) (:fill-color ([] 0 100 50))))'
          test "$(od -An -tx1 -N8 offscreen-ci.png | tr -d ' \n')" = "89504e470d0a1a0a"
          rm offscreen-ci.png
      - name: Run blocking canvas smoke
        run: xvfb-run -a env CALCIT_PAINT_SMOKE_ONCE=1 calcit ./calcit.cirru
